<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Annuaire ANFR — carte des opérateurs</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
html, body, #map { margin: 0; padding: 0; height: 100%; width: 100%; font-family: system-ui, sans-serif; }
.popup-title { font-weight: 600; margin-bottom: 4px; }
.popup-meta { color: #666; font-size: 12px; margin-bottom: 6px; }
.popup-list { max-height: 220px; overflow-y: auto; padding: 0; margin: 0; font-size: 12px; }
.popup-list li { list-style: none; padding: 1px 0; }
.popup-list .call { font-family: ui-monospace, monospace; font-weight: 600; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const POINTS = __POINTS_JSON__;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

const map = L.map('map').setView([46.7, 2.4], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({ maxClusterRadius: 50 });
for (const p of POINTS) {
  const items = p.indicatifs.map(i => `<li class="call">${esc(i)}</li>`).join('');
  const html = `
    <div class="popup-title">${esc(p.commune)}</div>
    <div class="popup-meta">CP ${esc(p.cp)} &middot; ${p.indicatifs.length} opérateur(s)</div>
    <ul class="popup-list">${items}</ul>
  `;
  cluster.addLayer(L.marker([p.lat, p.lon]).bindPopup(html, { maxWidth: 300 }));
}
map.addLayer(cluster);
</script>
</body>
</html>
